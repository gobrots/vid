<script>
(function(){
  let isAdBlockDetected = false;

  function checkAdBlock() {
    if (isAdBlockDetected) return;

    // 1. Cek elemen iklan (banner, ubox, pop-up, footer ad, dll) — ini yang paling akurat
    const adSelectors = [
      'iframe[src*="ad"]', '.adsbygoogle', '.ad-container', '.banner',
      '.sidebar-ad', '.right-ad', '.footer-ad', '.google-ad', '.doubleclick',
      'iframe[src*="google"]', 'iframe[src*="ads"]', '.adbox', '.ad-slot',
      '[id*="ad"]', '[class*="ad"]', 'div[style*="ad"]'
    ];
    const hasAd = adSelectors.some(sel => 
      document.querySelector(sel) !== null ||
      (sel.includes('iframe') && document.querySelectorAll(sel).length > 0)
    );
    if (hasAd) isAdBlockDetected = true;

    // 2. Cek jika video sudah dimuat tapi tombol play masih terlihat (cara paling kuat)
    const video = document.getElementById("blogVideo");
    const playBtn = document.getElementById("playButton");
    if (video && playBtn && playBtn.style.display !== "none" && video.currentTime > 0) {
      isAdBlockDetected = true;
    }

    if (isAdBlockDetected) {
      const playBtn = document.getElementById("playButton");
      if (playBtn) {
        playBtn.style.display = "none";
        playBtn.style.opacity = "0";
        playBtn.style.pointerEvents = "none";
      }
      showAdBlockWarningPopup();
    }
  }

  function showAdBlockWarningPopup() {
    const popup = document.createElement("div");
    popup.style.cssText = `
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: #ff0000; color: white; padding: 30px 45px; border-radius: 15px;
      font-size: 24px; text-align: center; z-index: 9999999999; box-shadow: 0 0 40px rgba(255,0,0,0.8);
      border: 6px solid #fff; font-family: Arial, sans-serif;
    `;
    popup.innerHTML = `
      <h2 style="margin:0 0 15px 0;">⚠️ AD BLOCK TERDETEKSI</h2>
      <p style="margin:0 0 20px 0; font-size:19px;">Kamu menggunakan adblocker / bypass iklan.<br>Kami tidak bisa melayani.</p>
      <p style="margin:0; font-size:17px;">Hapus adblocker untuk menonton video ini.</p>
      <button onclick="this.parentElement.remove()" 
              style="margin-top:25px; padding:14px 35px; background:#fff; color:#ff0000; border:none; border-radius:10px; font-size:19px; cursor:pointer;">
        TUTUP
      </button>
    `;
    document.body.appendChild(popup);

    // Destroy tombol play + semua turunan
    const playBtn = document.getElementById("playButton");
    if (playBtn) {
      playBtn.style.display = "none";
      playBtn.style.opacity = "0";
      playBtn.style.pointerEvents = "none";
    }

    const video = document.getElementById("blogVideo");
    const clickArea = document.querySelector(".video-click");
    const progressArea = document.querySelector(".progress-area");

    if (video) {
      video.pause();
      video.src = "";
      video.load();
      video.onplay = null;
      video.onpause = null;
      video.onloadedmetadata = null;
      video.ontimeupdate = null;
      video.onerror = null;
    }
    if (clickArea) {
      clickArea.onclick = null;
      clickArea.onmousemove = null;
      clickArea.ontouchstart = null;
      clickArea.ontouchend = null;
    }
    if (progressArea) {
      progressArea.onclick = null;
    }
  }

  // Jalankan deteksi (cukup cepat & aman)
  setInterval(checkAdBlock, 1200);
  setTimeout(checkAdBlock, 2500);
})();

<script>
(function(){
  // ==================== STORAGE SYSTEM ====================
  const PREFIX = "v_";
  const EXPIRE_MS = 7 * 24 * 60 * 60 * 1000;
  function cleanExpired() {
    const now = Date.now();
    Object.keys(localStorage).forEach(key => {
      if (key.startsWith(PREFIX)) {
        try {
          const data = JSON.parse(localStorage.getItem(key));
          if (!data || data.expire < now) localStorage.removeItem(key);
        } catch(e){ localStorage.removeItem(key); }
      }
    });
  }
  function getAllValid() {
    cleanExpired();
    const list = [];
    Object.keys(localStorage).forEach(key => {
      if (key.startsWith(PREFIX)) {
        try {
          const data = JSON.parse(localStorage.getItem(key));
          if (data && data.expire > Date.now()) {
            list.push({num: parseInt(key.replace(PREFIX,"")), id: data.id, ser: data.ser});
          }
        } catch(e){}
      }
    });
    return list;
  }
  function findExisting(id, ser) {
    const list = getAllValid();
    return list.find(item => item.id === id && item.ser === ser) || null;
  }
  function getNextNumber() {
    const list = getAllValid();
    return list.length ? Math.max(...list.map(i => i.num)) + 1 : 1;
  }
  function saveEntry(num, id, ser) {
    localStorage.setItem(PREFIX + num, JSON.stringify({id, ser, expire: Date.now() + EXPIRE_MS}));
  }
  function loadEntry(num) {
    try {
      const raw = localStorage.getItem(PREFIX + num);
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (!data || data.expire < Date.now()) { localStorage.removeItem(PREFIX + num); return null; }
      return data;
    } catch(e){ return null; }
  }

  // ========== LOGIC PARAMETER ==========
  var params = new URLSearchParams(window.location.search);
  var videoID = params.get("id");
  var server = params.get("ser") || "1";
  var shortNum = null;
  const rawSearch = window.location.search.substring(1);
  if (/^\d+$/.test(rawSearch)) shortNum = rawSearch;

  if (videoID) {
    let num = findExisting(videoID, server);
    if (!num) { num = getNextNumber(); saveEntry(num, videoID, server); }
    history.replaceState({}, document.title, window.location.origin + window.location.pathname + "?" + num);
  } else if (shortNum) {
    const data = loadEntry(shortNum);
    if (data) {
      videoID = data.id;
      server = data.ser;
    } else {
      history.replaceState({}, document.title, window.location.origin + window.location.pathname);
      showNoVideoInfo();
      return;
    }
  } else {
    showNoVideoInfo();
    return;
  }

  // ====================================
  var loadingScreen = document.getElementById("loadingScreen");
  if(loadingScreen) loadingScreen.style.display = "none";

  function decodeBase64(str){
    try { return atob(str); }
    catch(e){ return "https://cdn2.videy.co/"; }
  }

  const serverList = {
    "1": "aHR0cHM6Ly9jZG4yLnZpZGV5LmNvLw==",
    "2": "aHR0cHM6Ly9jZG4uYWNlaW1nLmNvbS8=",
    "3": "aHR0cHM6Ly9maWxlcy5jYXRib3gubW9lLw==",
    "4": "aHR0cHM6Ly9maWxlLmdhcmRlbi8="
  };

  let videoSrc;
  if (server === "5") {
    videoSrc = videoID;
  } else {
    const baseDomain = decodeBase64(serverList[server] || serverList["1"]);
    videoSrc = `${baseDomain}${videoID}.mp4`;
  }

  // ========== VIDEO LOGIC (99% sama) ==========
  var videoMode = document.getElementById("videoMode");
  var video = document.getElementById("blogVideo");
  var playBtn = document.getElementById("playButton");
  var clickArea = document.querySelector(".video-click");
  var progressArea = document.querySelector(".progress-area");
  var progressFill = document.querySelector(".progress-fill");
  var progressContainer = document.getElementById("progressContainer");
  var closeButton = document.getElementById("closeButton");
  var currentTimeEl = document.getElementById("currentTime");
  var totalTimeEl = document.getElementById("totalTime");

  document.body.style.overflow = "hidden";
  videoMode.style.display = "flex";

  let isVideoLoaded = false;
  let hideControlsTimeout = null;

  function formatTime(seconds) {
    if (isNaN(seconds) || !isFinite(seconds)) return "00:00";
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
  }

  function showControls() {
    progressContainer.classList.remove("hidden");
    clearTimeout(hideControlsTimeout);
    if (!video.paused) {
      hideControlsTimeout = setTimeout(() => {
        progressContainer.classList.add("hidden");
      }, 2500);
    }
  }

  function loadAndPlayVideo() {
    if (!isVideoLoaded) {
      video.src = videoSrc;
      video.load();
      isVideoLoaded = true;
    }
    video.play().catch(function(){});
  }

  // Play button
  playBtn.onclick = function() {
    loadAndPlayVideo();
  };

  // Klik area video
  clickArea.onclick = function() {
    if (!isVideoLoaded) {
      loadAndPlayVideo();
      return;
    }
    if (video.paused) video.play();
    else video.pause();
  };

  // Auto hide controls
  video.onplay = function() {
    playBtn.style.display = "none";
    showControls();
  };
  video.onpause = function() {
    playBtn.style.display = "flex";
    showControls();
    clearTimeout(hideControlsTimeout);
  };

  // Mouse / touch
  clickArea.addEventListener("mousemove", showControls);
  clickArea.addEventListener("touchstart", showControls);
  progressArea.addEventListener("click", showControls);

  // Metadata
  video.onloadedmetadata = function() {
    totalTimeEl.textContent = formatTime(video.duration);
  };

  // Update progress
  video.ontimeupdate = function() {
    if (video.duration) {
      progressFill.style.width = (video.currentTime / video.duration * 100) + "%";
      currentTimeEl.textContent = formatTime(video.currentTime);
    }
  };

  // Seek
  progressArea.onclick = function(e) {
    if (!isVideoLoaded) return;
    var rect = progressArea.getBoundingClientRect();
    var pos = (e.clientX - rect.left) / rect.width;
    video.currentTime = pos * video.duration;
    showControls();
  };

  closeButton.onclick = function() {
    history.back();
  };

  // ========== SIDEBAR ==========
  const sidebarToggle = document.getElementById("sidebarToggle");
  const sidebarPanel = document.getElementById("sidebarPanel");
  const sidebarClose = document.getElementById("sidebarClose");
  let sidebarHideTimeout = null;

  function openSidebar() {
    sidebarPanel.classList.add("open");
    sidebarToggle.style.display = "none";
    resetSidebarHideTimer();
  }
  function closeSidebar() {
    sidebarPanel.classList.remove("open");
    clearTimeout(sidebarHideTimeout);
    setTimeout(() => sidebarToggle.style.display = "flex", 300);
  }
  function resetSidebarHideTimer() {
    clearTimeout(sidebarHideTimeout);
    sidebarHideTimeout = setTimeout(closeSidebar, 3500);
  }
  sidebarToggle.addEventListener("click", openSidebar);
  sidebarClose.addEventListener("click", closeSidebar);
  sidebarPanel.addEventListener("mousemove", resetSidebarHideTimer);
  sidebarPanel.addEventListener("touchstart", resetSidebarHideTimer);
  sidebarPanel.addEventListener("click", resetSidebarHideTimer);

  // ========== KEYBOARD & DOUBLE TAP (tetap sama) ==========
  document.addEventListener("keydown", function(e) {
    if (!isVideoLoaded) return;
    if (e.code === "Space") {
      e.preventDefault();
      video.paused ? video.play() : video.pause();
      showControls();
    }
    if (e.code === "ArrowLeft") {
      e.preventDefault();
      video.currentTime = Math.max(0, video.currentTime - 10);
      showControls();
    }
    if (e.code === "ArrowRight") {
      e.preventDefault();
      video.currentTime = Math.min(video.duration, video.currentTime + 10);
      showControls();
    }
  });

  let lastTapTime = 0, lastTapX = 0;
  clickArea.addEventListener("touchend", function(e) {
    if (!isVideoLoaded) return;
    const currentTime = new Date().getTime();
    const tapX = e.changedTouches[0].clientX;
    const screenWidth = window.innerWidth;
    if (currentTime - lastTapTime < 300 && Math.abs(tapX - lastTapX) < 50) {
      e.preventDefault();
      if (tapX < screenWidth / 2) video.currentTime = Math.max(0, video.currentTime - 10);
      else video.currentTime = Math.min(video.duration, video.currentTime + 10);
      showControls();
    }
    lastTapTime = currentTime;
    lastTapX = tapX;
  });

  // ========== PROTECTION (tetap) ==========
  function enableVideoProtection(){
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', function(e){
      if(e.ctrlKey && (e.key === 'c' || e.key === 'u' || e.key === 's' || e.key === 'i' || e.key === 'a')){
        e.preventDefault();
      }
      if(e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'C' || e.key === 'J'))){
        e.preventDefault();
      }
    });
    document.addEventListener('copy', e => e.preventDefault());
    document.addEventListener('cut', e => e.preventDefault());
    document.addEventListener('paste', e => e.preventDefault());
  }
  enableVideoProtection();

  function showNoVideoInfo(){
    const infoDiv = document.createElement("div");
    infoDiv.style.cssText = `position:fixed;top:0;left:0;width:100%;height:100vh;background:#0f0f0f;color:#ffffff;z-index:9999999;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:Arial,sans-serif;text-align:center;padding:20px;`;
    infoDiv.innerHTML = `<h2>Video Player - GOBROTS</h2><p style="font-size:18px;margin:20px 0;">Belum ada video yang dipilih.</p><p>Cari di Pencarian Faceb00k => <strong>Gobrots Jimbits Stream</strong></p>`;
    document.body.appendChild(infoDiv);
  }
})();
</script>
