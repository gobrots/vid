    * {

    /* Loading */

    /* Close Button */
    #closeButton {
      position: absolute;

    /* Sidebar Toggle */
    #sidebarToggle {
      position: fixed;

    /* Sidebar Panel */

      <!-- Progress + Time -->

<script>
(function(){
  // ==================== STORAGE SYSTEM ====================
  const PREFIX = "v_";
  const EXPIRE_MS = 7 * 24 * 60 * 60 * 1000; // 7 hari

  function cleanExpired() {
    const now = Date.now();
    Object.keys(localStorage).forEach(key => {
      if (key.startsWith(PREFIX)) {
        try {
          const data = JSON.parse(localStorage.getItem(key));
          if (!data || data.expire < now) {
            localStorage.removeItem(key);
          }
        } catch (e) {
          localStorage.removeItem(key);
        }
      }
    });
  }

  function getAllValid() {
    cleanExpired();
    const list = [];
    Object.keys(localStorage).forEach(key => {
      if (key.startsWith(PREFIX)) {
        try {
          const data = JSON.parse(localStorage.getItem(key));
          if (data && data.expire > Date.now()) {
            list.push({
              num: parseInt(key.replace(PREFIX, "")),
              id: data.id,
              ser: data.ser
            });
          }
        } catch (e) {}
      }
    });
    return list;
  }

  function findExisting(id, ser) {
    const list = getAllValid();
    const found = list.find(item => item.id === id && item.ser === ser);
    return found ? found.num : null;
  }

  function getNextNumber() {
    const list = getAllValid();
    if (list.length === 0) return 1;
    const max = Math.max(...list.map(item => item.num));
    return max + 1;
  }

  function saveEntry(num, id, ser) {
    localStorage.setItem(PREFIX + num, JSON.stringify({
      id: id,
      ser: ser,
      expire: Date.now() + EXPIRE_MS
    }));
  }

  function loadEntry(num) {
    try {
      const raw = localStorage.getItem(PREFIX + num);
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (!data || data.expire < Date.now()) {
        localStorage.removeItem(PREFIX + num);
        return null;
      }
      return data;
    } catch (e) {
      return null;
    }
  }
  // ========================================================

  var params = new URLSearchParams(window.location.search);
  var videoID = params.get("id");
  var server = params.get("ser") || "1";
  var shortNum = null;

  // Deteksi URL pendek ?1 / ?2 / ?3
  const rawSearch = window.location.search.substring(1);
  if (/^\d+$/.test(rawSearch)) {
    shortNum = rawSearch;
  }

  // ========== LOGIC PARAMETER ==========
  if (videoID) {
    // URL lengkap ada id → cek apakah sudah pernah disimpan
    let num = findExisting(videoID, server);
    if (!num) {
      num = getNextNumber();
      saveEntry(num, videoID, server);
    }
    // Bersihkan URL jadi ?nomor
    history.replaceState({}, document.title, window.location.origin + window.location.pathname + "?" + num);
  } 
  else if (shortNum) {
    // URL pendek ?1 / ?2 → ambil dari storage
    const data = loadEntry(shortNum);
    if (data) {
      videoID = data.id;
      server = data.ser;
    } else {
      // Data tidak ada / sudah kadaluarsa
      history.replaceState({}, document.title, window.location.origin + window.location.pathname);
      showNoVideoInfo();
      return;
    }
  } 
  else {
    // Tidak ada id dan tidak ada nomor → tampilkan info
    showNoVideoInfo();
    return;
  }
  // ====================================

  var loadingScreen = document.getElementById("loadingScreen");
  if(loadingScreen) loadingScreen.style.display = "none";

  function decodeBase64(str){
    try { return atob(str); }
    catch(e){ return "https://cdn2.videy.co/"; }
  }

  const serverList = {
    "1": "aHR0cHM6Ly9jZG4yLnZpZGV5LmNvLw==",
    "2": "aHR0cHM6Ly9jZG4uYWNlaW1nLmNvbS8=",
    "3": "aHR0cHM6Ly9maWxlcy5jYXRib3gubW9lLw==",
    "4": "aHR0cHM6Ly9maWxlLmdhcmRlbi8="
  };

  // ========== SERVER 5 ==========
  let videoSrc;
  if (server === "5") {
    videoSrc = videoID;
  } else {
    const baseDomain = decodeBase64(serverList[server] || serverList["1"]);
    videoSrc = `${baseDomain}${videoID}.mp4`;
  }
  // ==============================

  var videoMode = document.getElementById("videoMode");
  var video = document.getElementById("blogVideo");
  var playBtn = document.getElementById("playButton");
  var clickArea = document.querySelector(".video-click");
  var progressArea = document.querySelector(".progress-area");
  var progressFill = document.querySelector(".progress-fill");
  var progressContainer = document.getElementById("progressContainer");
  var closeButton = document.getElementById("closeButton");
  var currentTimeEl = document.getElementById("currentTime");
  var totalTimeEl = document.getElementById("totalTime");

  document.body.style.overflow = "hidden";
  videoMode.style.display = "flex";

  let isVideoLoaded = false;
  let hideControlsTimeout = null;

  function formatTime(seconds) {
    if (isNaN(seconds) || !isFinite(seconds)) return "00:00";
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
  }

  function showControls() {
    progressContainer.classList.remove("hidden");
    clearTimeout(hideControlsTimeout);
    if (!video.paused) {
      hideControlsTimeout = setTimeout(() => {
        progressContainer.classList.add("hidden");
      }, 2500);
    }
  }

  function loadAndPlayVideo() {
    if (!isVideoLoaded) {
      video.src = videoSrc;
      video.load();
      isVideoLoaded = true;
    }
    video.play().catch(function(){});
  }

  // Play button
  playBtn.onclick = function() {
    loadAndPlayVideo();
  };

  // Klik area video
  clickArea.onclick = function() {
    if (!isVideoLoaded) {
      loadAndPlayVideo();
      return;
    }
    if (video.paused) {
      video.play();
    } else {
      video.pause();
    }
  };

  // Auto hide controls
  video.onplay = function() {
    playBtn.style.display = "none";
    showControls();
  };

  video.onpause = function() {
    playBtn.style.display = "flex";
    showControls();
    clearTimeout(hideControlsTimeout);
  };

  // Mouse / touch di area video → tampilkan controls
  clickArea.addEventListener("mousemove", showControls);
  clickArea.addEventListener("touchstart", showControls);
  progressArea.addEventListener("click", showControls);

  // Metadata siap
  video.onloadedmetadata = function() {
    totalTimeEl.textContent = formatTime(video.duration);
  };

  // Update progress + waktu
  video.ontimeupdate = function() {
    if (video.duration) {
      progressFill.style.width = (video.currentTime / video.duration * 100) + "%";
      currentTimeEl.textContent = formatTime(video.currentTime);
    }
  };

  // Seek
  progressArea.onclick = function(e) {
    if (!isVideoLoaded) return;
    var rect = progressArea.getBoundingClientRect();
    var pos = (e.clientX - rect.left) / rect.width;
    video.currentTime = pos * video.duration;
    showControls();
  };

  closeButton.onclick = function() {
    history.back();
  };

  // ========== SIDEBAR + AUTO HIDE ==========
  const sidebarToggle = document.getElementById("sidebarToggle");
  const sidebarPanel = document.getElementById("sidebarPanel");
  const sidebarClose = document.getElementById("sidebarClose");

  let sidebarHideTimeout = null;

  function openSidebar() {
    sidebarPanel.classList.add("open");
    sidebarToggle.style.display = "none";
    resetSidebarHideTimer();
  }

  function closeSidebar() {
    sidebarPanel.classList.remove("open");
    clearTimeout(sidebarHideTimeout);
    setTimeout(function() {
      sidebarToggle.style.display = "flex";
    }, 300);
  }

  function resetSidebarHideTimer() {
    clearTimeout(sidebarHideTimeout);
    sidebarHideTimeout = setTimeout(function() {
      closeSidebar();
    }, 3500);
  }

  sidebarToggle.addEventListener("click", function() {
    openSidebar();
  });

  sidebarClose.addEventListener("click", function() {
    closeSidebar();
  });

  sidebarPanel.addEventListener("mousemove", resetSidebarHideTimer);
  sidebarPanel.addEventListener("touchstart", resetSidebarHideTimer);
  sidebarPanel.addEventListener("click", resetSidebarHideTimer);
  // =========================================

  // ========== KEYBOARD CONTROL ==========
  document.addEventListener("keydown", function(e) {
    if (!isVideoLoaded) return;

    if (e.code === "Space") {
      e.preventDefault();
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
      showControls();
    }

    if (e.code === "ArrowLeft") {
      e.preventDefault();
      video.currentTime = Math.max(0, video.currentTime - 10);
      showControls();
    }

    if (e.code === "ArrowRight") {
      e.preventDefault();
      video.currentTime = Math.min(video.duration, video.currentTime + 10);
      showControls();
    }
  });
  // ======================================

  // ========== DOUBLE TAP SEEK (MOBILE) ==========
  let lastTapTime = 0;
  let lastTapX = 0;

  clickArea.addEventListener("touchend", function(e) {
    if (!isVideoLoaded) return;

    const currentTime = new Date().getTime();
    const tapX = e.changedTouches[0].clientX;
    const screenWidth = window.innerWidth;

    if (currentTime - lastTapTime < 300 && Math.abs(tapX - lastTapX) < 50) {
      e.preventDefault();

      if (tapX < screenWidth / 2) {
        video.currentTime = Math.max(0, video.currentTime - 10);
      } else {
        video.currentTime = Math.min(video.duration, video.currentTime + 10);
      }
      showControls();
    }

    lastTapTime = currentTime;
    lastTapX = tapX;
  });
  // ==============================================

  // Proteksi
  function enableVideoProtection(){
    document.addEventListener('contextmenu', e => {
      e.preventDefault();
      return false;
    });
    document.addEventListener('keydown', function(e){
      if(e.ctrlKey && (e.key === 'c' || e.key === 'u' || e.key === 's' || e.key === 'i' || e.key === 'a')){
        e.preventDefault();
        return false;
      }
      if(e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'C' || e.key === 'J'))){
        e.preventDefault();
        return false;
      }
    });
    document.addEventListener('copy', e => e.preventDefault());
    document.addEventListener('cut', e => e.preventDefault());
    document.addEventListener('paste', e => e.preventDefault());
  }
  enableVideoProtection();

  function showNoVideoInfo(){
    const infoDiv = document.createElement("div");
    infoDiv.style.cssText = `
      position:fixed;top:0;left:0;width:100%;height:100vh;
      background:#0f0f0f;color:#ffffff;z-index:9999999;
      display:flex;align-items:center;justify-content:center;
      flex-direction:column;font-family:Arial,sans-serif;
      text-align:center;padding:20px;
    `;
    infoDiv.innerHTML = `
      <h2>Video Player</h2>
      <p style="font-size:18px;margin:20px 0;">Belum ada video yang dipilih.</p>
      <p>Cari di Pencarian Faceb00k => <strong>Gobrots Jimbits Stream</strong></p>
    `;
    document.body.appendChild(infoDiv);
  }
})();
</script>
